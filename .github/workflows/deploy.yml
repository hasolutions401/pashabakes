# Puts the website live whenever main changes.
#  1. Runs the backend tests — if any fail, nothing is deployed.
#  2. Deploys to ONE host:
#     - Hostinger, once the repository variable HOSTINGER_HOST is set (see HOSTINGER.md), otherwise
#     - alwaysdata: logs in over SSH and runs `git pull` in ~/pashabakess.
#  3. Checks that the live site answers AND serves exactly the files of this commit
#     (fails loudly if the site root points at another folder or the server copy was changed by hand).
# Secrets/variables: repository Settings → Secrets and variables → Actions.
#   alwaysdata: secret ALWAYSDATA_SSH_PASSWORD; optional variable ALWAYSDATA_SSH_FINGERPRINT (server key check)
#   Hostinger:  secret HOSTINGER_SSH_PASSWORD, variables HOSTINGER_HOST, HOSTINGER_PORT, HOSTINGER_USER, HOSTINGER_DOMAIN,
#               optional HOSTINGER_SSH_FINGERPRINT
# Third-party actions are pinned to exact commits (the tag they had is in the comment).
# Can also be started by hand: Actions → "Deploy website" → Run workflow (always deploys main).
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-alwaysdata
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, gd, mbstring
          coverage: none
      - name: Backend tests
        run: php server/tests/run.php

  deploy:
    needs: test
    if: vars.HOSTINGER_HOST == '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PASSWORD: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
      SITE: https://pashabakess.alwaysdata.net
    steps:
      - name: Password not set yet
        if: env.SSH_PASSWORD == ''
        run: echo "::warning::Not deployed — add the ALWAYSDATA_SSH_PASSWORD secret (Settings → Secrets and variables → Actions)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.SSH_PASSWORD != ''
      - name: Update the live site
        if: env.SSH_PASSWORD != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ssh-pashabakess.alwaysdata.net
          username: pashabakess
          password: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
          fingerprint: ${{ vars.ALWAYSDATA_SSH_FINGERPRINT }}
          script: |
            set -e
            cd ~/pashabakess
            git fetch origin main
            git checkout main
            git merge --ff-only origin/main
            git log --oneline -1
            git status --short --untracked-files=no
      - name: Check the live site answers and serves this commit
        if: env.SSH_PASSWORD != ''
        run: |
          sleep 5
          curl -fsS "$SITE/api/menu.php" | grep -q '"ok":true'
          for f in index.html order.html app.js style.css; do
            curl -fsS "$SITE/$f?deploy=$GITHUB_SHA" -o "$RUNNER_TEMP/live-$f"
            if ! cmp -s "$RUNNER_TEMP/live-$f" "dist/$f"; then
              echo "::error::The live $f is not the one in this commit. The site may be serving another folder (check the site's root directory in alwaysdata) or the server copy was changed by hand."
              exit 1
            fi
          done
          echo "Live site OK and up to date: $SITE/"

  deploy-hostinger:
    needs: test
    if: vars.HOSTINGER_HOST != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
      DOMAIN: ${{ vars.HOSTINGER_DOMAIN }}
    steps:
      - name: Password not set yet
        if: env.SSH_PASSWORD == ''
        run: echo "::warning::Not deployed — add the HOSTINGER_SSH_PASSWORD secret (see HOSTINGER.md)."
      - name: Update the live site on Hostinger
        if: env.SSH_PASSWORD != ''
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ vars.HOSTINGER_HOST }}
          port: ${{ vars.HOSTINGER_PORT || 65002 }}
          username: ${{ vars.HOSTINGER_USER }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          fingerprint: ${{ vars.HOSTINGER_SSH_FINGERPRINT }}
          envs: DOMAIN
          script: |
            set -e
            BASE="$HOME/domains/$DOMAIN"
            [ -d "$BASE" ] || { echo "Folder $BASE not found: check the HOSTINGER_DOMAIN variable"; exit 1; }
            if [ ! -d "$BASE/repo/.git" ]; then
              git clone --branch main https://github.com/hasolutions401/pashabakes.git "$BASE/repo"
            fi
            cd "$BASE/repo"
            git fetch origin main
            git checkout -q main
            git merge --ff-only origin/main
            mkdir -p "$BASE/server" "$BASE/public_html"
            # Copy over the old files only — nothing on the server is deleted:
            # public_html/uploads (Pasha's photos), server/config.php and server/data (orders) stay as they are.
            cp -a "$BASE/repo/dist/." "$BASE/public_html/"
            cp -a "$BASE/repo/server/." "$BASE/server/"
            git log --oneline -1
      - name: Check the live site answers
        if: env.SSH_PASSWORD != ''
        run: |
          sleep 5
          curl -fsS "https://$DOMAIN/api/menu.php" | grep -q '"ok":true'
          echo "Live site OK: https://$DOMAIN/"
